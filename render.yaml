services:
  - type: web
    name: backendaura
    env: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: NODE_OPTIONS=--max-old-space-size=4096 npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://french-learning-platform-ngonpericles-educms-projects.vercel.app
      - key: FRONTEND_URL
        value: https://french-learning-platform-ngonpericles-educms-projects.vercel.app
